name: Windows ARM64 tests - MSVC
on:
  push:
    branches:
      - msvc_scipy_arm64
      - maintenance/**
  pull_request:
    branches:
      - main
      - maintenance/**
permissions:
   contents: read  # to fetch code (actions/checkout)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  get_commit_message:
    name: Get commit message
    uses: ./.github/workflows/commit_message.yml
  fast_spin:
    name: fast, py3.12/npAny, spin
    needs: get_commit_message
    # Ensure (a) this doesn't run on forks by default, and
    #        (b) it does run with Act locally (`github` doesn't exist there)
    # if: >
    #   needs.get_commit_message.outputs.message == 1
    #   && (github.repository == 'scipy/scipy' || github.repository == '')
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          
      - name: Setup Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
          architecture: 'arm64'
          cache: 'pip'
          cache-dependency-path: 'environment.yml'
          
      - name: Setup MSVC Environment
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" arm64
          
          REM Test that cl is available
          where cl
          cl /?
          
          REM Save environment variables to GITHUB_ENV
          echo CC=cl>> %GITHUB_ENV%
          echo CXX=cl>> %GITHUB_ENV%
          
      - name: Install LLVM
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.6/LLVM-20.1.6-woa64.exe -UseBasicParsing -OutFile LLVM-woa64.exe
          Start-Process -FilePath ".\LLVM-woa64.exe" -ArgumentList "/S" -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # Set Fortran compiler (flang-new from LLVM)
          echo "FC=flang-new" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Install pkgconf via vcpkg
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          $env:VCPKG_ROOT = "C:\vcpkg"
          Set-Location $env:VCPKG_ROOT
          ./vcpkg install pkgconf:arm64-windows
          $pkgconfPath = "$env:VCPKG_ROOT\installed\arm64-windows\tools\pkgconf"
          Copy-Item "$pkgconfPath\pkgconf.exe" "$pkgconfPath\pkg-config.exe" -Force
          echo "$pkgconfPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: pip-packages
        run: |
          pip install numpy cython pybind11 pythran meson ninja pytest pytest-xdist pytest-timeout pooch spin hypothesis
          python -m pip install -r requirements/openblas.txt
          
      - name: Build
        shell: pwsh
        run: |
          # Re-initialize MSVC environment for this step
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsPath)) {
            $vsPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools"
          }
          $vcvarsPath = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"
          
          # Run build with MSVC environment
          cmd /c """$vcvarsPath"" arm64 && spin build --with-scipy-openblas -S-Duse-pythran=false -S--vsenv"
          
      - name: Test
        run: |
          # test runner parallel clashes with OpenBLAS multithreading
          $env:OPENBLAS_NUM_THREADS=1
          spin test -j4 -- --durations=25
